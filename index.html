    @keyframes number-in{from{opacity:.2;transform:translateY(7px) scale(.92)}to{opacity:1;transform:none}}
    @keyframes sheen{from{transform:translateX(-130%)}to{transform:translateX(350%)}}

    const status = document.getElementById('status');

      left -= 1;

      const done = Math.min(((total - left) / total) * 100, 100);

      number.textContent = String(Math.max(left, 0)).padStart(2, '0');
      progress.style.width = done + '%';
